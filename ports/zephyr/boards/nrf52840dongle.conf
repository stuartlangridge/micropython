# note that not wanting networking is a Stuart choice and should
# not be pushed upstream!!!!! the board supports it
CONFIG_NETWORKING=n

CONFIG_BT=y
CONFIG_BT_DEVICE_NAME_DYNAMIC=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_CENTRAL=n
CONFIG_BT_GATT_CLIENT=y
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

CONFIG_BT_L2CAP_TX_MTU=251
CONFIG_BT_BUF_ACL_RX_SIZE=260
CONFIG_BT_BUF_ACL_TX_SIZE=260
CONFIG_BT_BUF_ACL_TX_COUNT=10
CONFIG_BT_CONN_TX_MAX=10
CONFIG_BT_GATT_DYNAMIC_DB=y

CONFIG_BT_SMP=n
CONFIG_BT_BUF_EVT_RX_COUNT=11
## SMP=n requires these to prevent BlueZ from attempting pairing.
CONFIG_BT_BONDABLE=n
CONFIG_BT_FIXED_PASSKEY=n
# Privacy requires SMP for IRK exchange; with SMP=n this causes
# BlueZ/Chrome to drop the connection immediately after connect.
CONFIG_BT_PRIVACY=n

## BlueZ hardcodes 420ms supervision timeout at connection.
## We request 6s timeout via L2CAP conn param update ASAP.
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=600
CONFIG_BT_GAP_AUTO_UPDATE_CONN_PARAMS=y
# Default is 5000ms (5s) — far too late, connection dies at 420ms.
CONFIG_BT_CONN_PARAM_UPDATE_TIMEOUT=100
# Force L2CAP path for conn param updates instead of LL path.
# The LL path uses HCI commands which may be blocked by PHY/DLE
# procedures. L2CAP goes through the ACL data path instead.
CONFIG_BT_CTLR_CONN_PARAM_REQ=n
# Zephyr LL SW controller on nRF52840 loses radio sync after 2M PHY
# switch. BT4 adapters (no 2M) work fine. 1M is fast enough.
CONFIG_BT_CTLR_PHY_2M=n

CONFIG_MICROPY_HEAP_SIZE=98304
CONFIG_MAIN_STACK_SIZE=8192

# CONFIG_DYNAMIC_THREAD=y
CONFIG_THREAD_CUSTOM_DATA=y
CONFIG_THREAD_MONITOR=y
CONFIG_THREAD_STACK_INFO=y

CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_LITTLEFS=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_MICROPY_VFS_FAT=n
CONFIG_MICROPY_VFS_LFS1=n
CONFIG_MICROPY_VFS_LFS2=n
# Default heap for littlefs is too small
CONFIG_FS_LITTLEFS_FC_HEAP_SIZE=8192
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y

# Enable asyncio by default (for aioble)
CONFIG_MICROPY_FROZEN_MODULES=y
CONFIG_MICROPY_FROZEN_MANIFEST="boards/nrf52840dongle/manifest.py"

# raise feature level (so aioble gets select)
CONFIG_MICROPY_CONFIGFILE="boards/nrf52840dongle/mpconfigport.h"

# Enable SPI
CONFIG_SPI=y
CONFIG_GPIO=y
CONFIG_DISPLAY=y
CONFIG_ST7735R=y
CONFIG_MIPI_DBI=y /* required by the new driver layer */

# Rotary encoder
CONFIG_QDEC_NRFX=y
CONFIG_SENSOR=y

# PWM for screen backlight
CONFIG_PWM=y
CONFIG_PWM_NRFX=y
